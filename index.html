<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>興嘉國小 萬用互動學習便利貼牆</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif; background-color: #f3f4f6; }
        .masonry { column-count: 1; column-gap: 1rem; }
        @media (min-width: 640px) { .masonry { column-count: 2; } }
        @media (min-width: 768px) { .masonry { column-count: 3; } }
        @media (min-width: 1024px) { .masonry { column-count: 4; } }
        .masonry-item { break-inside: avoid; margin-bottom: 1rem; display: inline-block; width: 100%; }
        .note-card { transition: transform 0.2s; }
        .note-card:hover { transform: translateY(-5px); }
    </style>
</head>
<body class="min-h-screen bg-gray-100 transition-colors duration-500" id="bodyBg">

    <!-- 頂部導覽列 -->
    <header class="bg-white/90 backdrop-blur shadow-md sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <h1 class="text-xl font-bold text-gray-800 cursor-pointer" onclick="openThemeModal()">
                <i class="fa-solid fa-chalkboard-user mr-2 text-blue-500"></i>
                <span id="headerTitle">興嘉國小 晨讀心得牆</span>
            </h1>
            <div class="flex gap-2">
                <button onclick="syncWithCloud()" class="bg-green-100 text-green-700 px-3 py-1.5 rounded-lg text-sm font-medium hover:bg-green-200 transition">
                    <i class="fa-solid fa-rotate mr-1"></i>同步
                </button>
                <button onclick="openThemeModal()" class="bg-amber-100 text-amber-700 px-3 py-1.5 rounded-lg text-sm font-medium hover:bg-amber-200 transition">
                    <i class="fa-solid fa-palette mr-1"></i>主題
                </button>
                <button onclick="openPostModal()" class="bg-blue-500 text-white px-4 py-1.5 rounded-lg text-sm font-medium hover:bg-blue-600 shadow-sm transition">
                    <i class="fa-solid fa-plus mr-1"></i>投稿
                </button>
            </div>
        </div>
    </header>

    <!-- 留言牆主要區域 -->
    <main class="max-w-7xl mx-auto px-4 py-8">
        <div id="wallContainer" class="masonry">
            <!-- 卡片會由 JS 動態生成在這裡 -->
        </div>
    </main>

    <!-- 投稿彈窗 (已修復 ID 問題) -->
    <div id="postModal" class="hidden fixed inset-0 z-50 bg-black/50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-md overflow-hidden">
            <div class="bg-blue-500 p-4 text-white flex justify-between items-center">
                <h2 class="text-lg font-bold"><i class="fa-solid fa-pen-to-square mr-2"></i>新增便利貼</h2>
                <button onclick="closePostModal()" class="text-white/80 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <div class="p-5 space-y-4">
                <div class="flex gap-3">
                    <input type="text" id="postClass" placeholder="班級" class="w-1/3 p-2 border rounded-lg focus:ring-2 focus:ring-blue-300 outline-none">
                    <input type="text" id="postName" placeholder="姓名/暱稱" class="w-2/3 p-2 border rounded-lg focus:ring-2 focus:ring-blue-300 outline-none">
                </div>
                <input type="text" id="postTitle" placeholder="標題" class="w-full p-2 border rounded-lg focus:ring-2 focus:ring-blue-300 outline-none">
                <textarea id="postContent" rows="4" placeholder="寫下你的想法..." class="w-full p-2 border rounded-lg focus:ring-2 focus:ring-blue-300 outline-none"></textarea>
                <div class="flex gap-2">
                    <div class="w-8 h-8 rounded-full bg-yellow-200 cursor-pointer border-2 border-transparent hover:border-gray-400" onclick="selectColor('bg-yellow-200')"></div>
                    <div class="w-8 h-8 rounded-full bg-pink-200 cursor-pointer border-2 border-transparent hover:border-gray-400" onclick="selectColor('bg-pink-200')"></div>
                    <div class="w-8 h-8 rounded-full bg-blue-200 cursor-pointer border-2 border-transparent hover:border-gray-400" onclick="selectColor('bg-blue-200')"></div>
                    <div class="w-8 h-8 rounded-full bg-green-200 cursor-pointer border-2 border-transparent hover:border-gray-400" onclick="selectColor('bg-green-200')"></div>
                </div>
                <button onclick="submitPost()" class="w-full bg-blue-500 text-white font-bold py-2 rounded-lg hover:bg-blue-600 transition">送出投稿</button>
            </div>
        </div>
    </div>

    <!-- 主題切換彈窗 -->
    <div id="themeModal" class="hidden fixed inset-0 z-50 bg-black/50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-lg overflow-hidden">
            <div class="bg-amber-500 p-4 text-white flex justify-between items-center">
                <h2 class="text-lg font-bold"><i class="fa-solid fa-palette mr-2"></i>切換主題與節慶</h2>
                <button onclick="closeThemeModal()" class="text-white/80 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <div class="p-5 grid grid-cols-2 gap-4 max-h-[60vh] overflow-y-auto">
                <button onclick="applyTheme('晨讀心得分享', 'bg-gray-100')" class="p-4 border rounded-xl hover:bg-gray-50 text-left">
                    <div class="text-2xl mb-2">📚</div><div class="font-bold">晨讀心得牆</div>
                </button>
                <button onclick="applyTheme('教師節感恩牆', 'bg-orange-50')" class="p-4 border rounded-xl hover:bg-orange-50 text-left">
                    <div class="text-2xl mb-2">🍎</div><div class="font-bold">教師節敬師</div>
                </button>
                <button onclick="applyTheme('母親節感恩牆', 'bg-pink-50')" class="p-4 border rounded-xl hover:bg-pink-50 text-left">
                    <div class="text-2xl mb-2">🌸</div><div class="font-bold">母親節感恩</div>
                </button>
                <button onclick="applyTheme('畢業季祝福', 'bg-blue-50')" class="p-4 border rounded-xl hover:bg-blue-50 text-left">
                    <div class="text-2xl mb-2">🎓</div><div class="font-bold">畢業季祝福</div>
                </button>
            </div>
        </div>
    </div>

    <script>
        // 您的 Google Apps Script 專屬網址
        const GAS_URL = "https://script.google.com/macros/s/AKfycby4qr-hd5bA_rsg0MU5qvXk1cGXcYS2HK_yh5G_kqNIS7ODQooUc12sA--dqbxDsBI4/exec";
        
        let notes = JSON.parse(localStorage.getItem('eduWallNotes')) || [];
        let currentColor = 'bg-yellow-200';

        // 彈窗控制邏輯 (核心修復區)
        function openPostModal() { document.getElementById('postModal').classList.remove('hidden'); }
        function closePostModal() { document.getElementById('postModal').classList.add('hidden'); }
        function openThemeModal() { document.getElementById('themeModal').classList.remove('hidden'); }
        function closeThemeModal() { document.getElementById('themeModal').classList.add('hidden'); }

        function selectColor(color) { currentColor = color; }

        function applyTheme(title, bgColorClass) {
            document.getElementById('headerTitle').innerText = '興嘉國小 ' + title;
            document.getElementById('bodyBg').className = `min-h-screen transition-colors duration-500 ${bgColorClass}`;
            closeThemeModal();
        }

        // 渲染留言牆
        function renderWall() {
            const container = document.getElementById('wallContainer');
            container.innerHTML = '';
            notes.reverse().forEach(note => {
                const card = document.createElement('div');
                card.className = `masonry-item note-card ${note.color} p-4 rounded-xl shadow-sm border border-black/5`;
                card.innerHTML = `
                    <div class="text-xs text-gray-500 mb-1 flex justify-between">
                        <span>${note.classInfo} ${note.name}</span>
                        <span>${note.date}</span>
                    </div>
                    <h3 class="font-bold text-gray-800 mb-2">${note.title}</h3>
                    <p class="text-gray-700 whitespace-pre-wrap text-sm">${note.content}</p>
                    <div class="mt-4 flex gap-2">
                        <button onclick="likeNote('${note.id}')" class="text-red-500 text-sm bg-white/50 px-2 py-1 rounded-full hover:bg-white/80">
                            ❤️ ${note.likes || 0}
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });
            notes.reverse(); // 恢復原始順序
        }

        // 新增投稿
        function submitPost() {
            const classInfo = document.getElementById('postClass').value.trim();
            const name = document.getElementById('postName').value.trim() || '匿名';
            const title = document.getElementById('postTitle').value.trim();
            const content = document.getElementById('postContent').value.trim();

            if (!content) { alert('請填寫內容！'); return; }

            const newNote = {
                id: Date.now().toString(),
                classInfo: classInfo,
                name: name,
                title: title,
                content: content,
                color: currentColor,
                date: new Date().toLocaleDateString('zh-TW'),
                likes: 0
            };

            notes.push(newNote);
            saveData();
            renderWall();
            
            // 清空表單
            document.getElementById('postClass').value = '';
            document.getElementById('postName').value = '';
            document.getElementById('postTitle').value = '';
            document.getElementById('postContent').value = '';
            closePostModal();

            // 背景同步至 Google 試算表
            syncToGAS('add', newNote);
        }

        // 按讚功能
        function likeNote(id) {
            const note = notes.find(n => n.id === id);
            if(note) {
                note.likes = (note.likes || 0) + 1;
                saveData();
                renderWall();
                syncToGAS('like', { id: id, likes: note.likes });
            }
        }

        // 儲存至本機
        function saveData() { localStorage.setItem('eduWallNotes', JSON.stringify(notes)); }

        // 背景同步至 GAS (單向寫入測試)
        function syncToGAS(action, data) {
            fetch(GAS_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: action, data: data })
            }).catch(e => console.log('背景同步失敗:', e));
        }

        // 點擊同步按鈕 (讀取雲端)
        function syncWithCloud() {
            const btn = document.querySelector('button[onclick="syncWithCloud()"]');
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-1"></i>同步中';
            fetch(GAS_URL)
                .then(res => res.json())
                .then(data => {
                    if (data && data.length > 0) {
                        notes = data;
                        saveData();
                        renderWall();
                    }
                    btn.innerHTML = '<i class="fa-solid fa-check mr-1"></i>已同步';
                    setTimeout(() => btn.innerHTML = '<i class="fa-solid fa-rotate mr-1"></i>同步', 2000);
                })
                .catch(err => {
                    console.log(err);
                    btn.innerHTML = '<i class="fa-solid fa-triangle-exclamation mr-1"></i>失敗';
                    setTimeout(() => btn.innerHTML = '<i class="fa-solid fa-rotate mr-1"></i>同步', 2000);
                });
        }

        // 初始載入
        renderWall();
    </script>
</body>
</html>
