<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>興嘉國小 互動學習便利貼牆</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif; background-color: #fffbeb; background-image: radial-gradient(#d1d5db 1px, transparent 1px); background-size: 20px 20px; transition: background-color 0.5s ease;}
        .masonry { column-count: 1; column-gap: 1.5rem; padding: 1rem; }
        @media (min-width: 640px) { .masonry { column-count: 2; } }
        @media (min-width: 800px) { .masonry { column-count: 3; } }
        @media (min-width: 1100px) { .masonry { column-count: 4; } }
        @media (min-width: 1400px) { .masonry { column-count: 5; } }
        .masonry-item { break-inside: avoid; margin-bottom: 1.5rem; display: block; width: 100%; position: relative; }
        .note-card { transition: all 0.2s ease; }
        .note-card:hover { transform: translateY(-3px); box-shadow: 0 12px 20px -5px rgba(0, 0, 0, 0.1); }
    </style>
</head>
<body class="min-h-screen text-gray-800" id="bodyBg">

    <header class="bg-white/95 backdrop-blur shadow-sm sticky top-0 z-40">
        <div class="max-w-[1600px] mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-amber-500 rounded-xl flex items-center justify-center text-white text-xl shadow-md"><i class="fa-solid fa-chalkboard-user"></i></div>
                <div>
                    <span class="text-xs font-bold bg-amber-100 text-amber-800 px-2 py-0.5 rounded-full">嘉義市興嘉國小</span>
                    <h1 class="text-xl font-bold mt-0.5 text-gray-800" id="headerTitle">晨讀心得分享牆 📖 ✏️</h1>
                </div>
            </div>
            <div class="flex gap-2 items-center">
                
                <div id="adminControls" class="hidden flex items-center gap-1 sm:gap-2">
                    <span id="roleBadge" class="bg-green-100 text-green-700 px-2 py-1.5 rounded-lg text-sm font-bold border border-green-200 hidden sm:block">教師模式</span>
                    <button onclick="logoutAdmin()" class="bg-gray-200 text-gray-700 px-3 py-1.5 rounded-lg text-sm font-bold hover:bg-red-500 hover:text-white transition shadow-sm">登出</button>
                </div>
                
                <div class="bg-gray-100 p-1 rounded-lg flex text-sm font-medium border border-gray-200 hidden lg:flex">
                    <button class="px-3 py-1 bg-white shadow-sm rounded-md"><i class="fa-solid fa-table-columns mr-1"></i>瀑布流</button>
                </div>
                <button onclick="openModal('themeModal')" class="bg-amber-100 text-amber-700 border border-amber-200 px-3 py-1.5 rounded-lg text-sm font-bold hover:bg-amber-200 transition hidden sm:block"><i class="fa-solid fa-palette mr-1"></i>主題</button>
                <button onclick="syncWithCloud()" id="syncBtn" class="bg-blue-50 text-blue-600 border border-blue-100 px-3 py-1.5 rounded-lg text-sm font-bold hover:bg-blue-100 transition"><i class="fa-solid fa-rotate mr-1"></i>同步</button>
                <button id="teacherBtn" onclick="openModal('teacherModal')" class="bg-gray-800 text-white px-3 py-1.5 rounded-lg text-sm font-bold hover:bg-gray-700 transition hidden sm:block"><i class="fa-solid fa-user-gear mr-1"></i>管理</button>
                <button onclick="openModal('postModal')" class="bg-orange-500 text-white px-4 py-1.5 rounded-lg text-sm font-bold hover:bg-orange-600 shadow-md transition transform hover:scale-105"><i class="fa-solid fa-plus mr-1"></i>我要投稿</button>
            </div>
        </div>
    </header>

    <div class="bg-amber-50/90 border-b border-amber-200 backdrop-blur-sm transition-all duration-300">
        <div class="max-w-[1600px] mx-auto px-4 py-4 flex justify-between items-center flex-wrap gap-4">
            <div>
                <div class="flex items-center gap-2 mb-2 text-sm text-gray-500">
                    <span id="headerTag" class="bg-orange-500 text-white text-xs px-2 py-0.5 rounded font-bold">閱讀推廣</span>
                    <i class="fa-regular fa-clock"></i> <span id="updateTime">更新時間：載入中...</span>
                </div>
                <p class="text-gray-700 font-medium" id="headerDesc">歡迎興嘉國小的同學們！讀完一本好書後，請寫下 50 字心得與喜愛的一句話，並拍照上傳與全班分享喔！</p>
            </div>
            <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-3 flex gap-6 text-center min-w-[300px]">
                <div class="flex-1 border-r border-gray-100"><div class="text-2xl font-black text-orange-500" id="statPosts">0</div><div class="text-xs text-gray-500 mt-1">投稿數</div></div>
                <div class="flex-1 border-r border-gray-100"><div class="text-2xl font-black text-pink-500" id="statLikes">0</div><div class="text-xs text-gray-500 mt-1">讚數</div></div>
                <div class="flex-1"><div class="text-2xl font-black text-blue-500">0</div><div class="text-xs text-gray-500 mt-1">迴響</div></div>
            </div>
        </div>
    </div>

    <main class="max-w-[1600px] mx-auto py-6">
        <div id="wallContainer" class="masonry"></div>
    </main>

    <!-- 投稿彈窗 -->
    <div id="postModal" class="hidden fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4 backdrop-blur-sm transition-opacity">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg overflow-hidden transform transition-all max-h-[90vh] overflow-y-auto">
            <div class="bg-gradient-to-r from-orange-500 to-amber-500 p-4 text-white flex justify-between items-center sticky top-0 z-10"><h2 class="text-lg font-bold"><i class="fa-solid fa-pen-to-square mr-2"></i>新增便利貼</h2><button onclick="closeModal('postModal')" class="text-white/80 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button></div>
            <div class="p-6 space-y-4">
                <div class="flex gap-3">
                    <div class="w-2/5"><input type="text" id="postClass" placeholder="班級 (必填)" class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:border-orange-400 focus:ring-1 focus:ring-orange-400"></div>
                    <div class="w-3/5"><input type="text" id="postName" placeholder="姓名/暱稱 (必填)" class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:border-orange-400 focus:ring-1 focus:ring-orange-400"></div>
                </div>
                <input type="text" id="postTitle" placeholder="給這篇留言一個標題吧！(必填)" class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:border-orange-400 focus:ring-1 focus:ring-orange-400 font-bold">
                <div class="relative"><textarea id="postContent" rows="4" placeholder="寫下你的想法... (與照片二擇一必填)" class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:border-orange-400 focus:ring-1 focus:ring-orange-400 resize-none"></textarea></div>
                
                <div class="bg-orange-50/50 p-4 rounded-xl border border-orange-100">
                    <label class="block text-sm font-bold text-gray-700 mb-2"><i class="fa-solid fa-camera mr-1 text-orange-500"></i>上傳照片 <span class="text-orange-500 font-normal">(與想法二擇一)</span></label>
                    <input type="file" id="postImage" accept="image/*" onchange="previewImage(event)" class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-orange-500 file:text-white hover:file:bg-orange-600 cursor-pointer">
                    <div id="imagePreviewContainer" class="mt-3 hidden relative"><img id="imagePreview" class="w-full max-h-48 rounded-lg object-cover border border-gray-200"><button onclick="clearImage()" class="absolute top-2 right-2 bg-red-500 text-white w-8 h-8 rounded-full shadow hover:bg-red-600 flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button></div>
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">選擇頭像顏色</label>
                    <div class="flex gap-3">
                        <div class="w-10 h-10 rounded-full bg-green-400 cursor-pointer border-4 border-white shadow hover:ring-2 hover:ring-green-500" onclick="selectColor('bg-green-400')"></div>
                        <div class="w-10 h-10 rounded-full bg-yellow-400 cursor-pointer border-4 border-white shadow hover:ring-2 hover:ring-yellow-500" onclick="selectColor('bg-yellow-400')"></div>
                        <div class="w-10 h-10 rounded-full bg-orange-400 cursor-pointer border-4 border-white shadow hover:ring-2 hover:ring-orange-500" onclick="selectColor('bg-orange-400')"></div>
                        <div class="w-10 h-10 rounded-full bg-pink-400 cursor-pointer border-4 border-white shadow hover:ring-2 hover:ring-pink-500" onclick="selectColor('bg-pink-400')"></div>
                        <div class="w-10 h-10 rounded-full bg-blue-400 cursor-pointer border-4 border-white shadow hover:ring-2 hover:ring-blue-500" onclick="selectColor('bg-blue-400')"></div>
                    </div>
                </div>
                <button onclick="submitPost()" class="w-full bg-gradient-to-r from-orange-500 to-amber-500 text-white font-bold py-3 rounded-xl hover:shadow-lg transition mt-2">🚀 送出投稿</button>
            </div>
        </div>
    </div>

    <!-- 教師編修彈窗 -->
    <div id="editModal" class="hidden fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4 backdrop-blur-sm transition-opacity"><div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg overflow-hidden transform transition-all"><div class="bg-gray-800 p-4 text-white flex justify-between items-center"><h2 class="text-lg font-bold"><i class="fa-solid fa-pen-ruler mr-2"></i>教師編修留言</h2><button onclick="closeModal('editModal')" class="text-white/80 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button></div><div class="p-6 space-y-4"><input type="hidden" id="editId"><div class="flex gap-3"><input type="text" id="editClass" placeholder="班級" class="w-2/5 p-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:border-gray-500"><input type="text" id="editName" placeholder="姓名" class="w-3/5 p-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:border-gray-500"></div><input type="text" id="editTitle" placeholder="標題" class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:border-gray-500 font-bold"><textarea id="editContent" rows="5" class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:border-gray-500 resize-none"></textarea><button onclick="submitEdit()" class="w-full bg-gray-800 text-white font-bold py-3 rounded-xl hover:bg-gray-700 transition">💾 儲存修改</button></div></div></div>

    <!-- 教師登入與主控台彈窗 -->
    <div id="teacherModal" class="hidden fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm overflow-hidden">
            <div class="bg-gray-800 p-4 text-white flex justify-between items-center">
                <h2 class="text-lg font-bold"><i class="fa-solid fa-user-gear mr-2"></i>管理員登入</h2>
                <button onclick="closeModal('teacherModal')" class="text-white/80 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            
            <div id="adminLogin" class="p-6">
                <p class="text-sm text-gray-600 mb-4">請輸入教師密碼或總管密碼</p>
                <input type="password" id="adminPwd" placeholder="請輸入密碼" class="w-full p-3 border rounded-xl mb-4 focus:outline-none focus:border-gray-500">
                <button id="loginBtn" onclick="checkAdmin()" class="w-full bg-gray-800 text-white font-bold py-3 rounded-xl hover:bg-gray-700 flex justify-center items-center">
                    驗證身分登入
                </button>
            </div>
            
            <div id="adminPanel" class="p-6 hidden space-y-4">
                <div class="text-green-600 font-bold border-b pb-3 mb-2 flex items-center"><i class="fa-solid fa-check-circle mr-2 text-xl"></i>已成功登入管理模式</div>
                
                <!-- 總管專屬按鈕：管理教師帳號 -->
                <button id="superAdminBtn" onclick="openTeacherManage()" class="hidden w-full bg-blue-100 text-blue-700 font-bold py-3 rounded-xl hover:bg-blue-200 border border-blue-200 transition">
                    <i class="fa-solid fa-users-gear mr-2"></i>管理教師帳號 (總管專用)
                </button>
                
                <button onclick="clearAllNotes()" class="w-full bg-red-100 text-red-600 font-bold py-3 rounded-xl hover:bg-red-200 border border-red-200 transition">
                    <i class="fa-solid fa-dumpster-fire mr-2"></i>危險：清空整面留言牆
                </button>
            </div>
        </div>
    </div>

    <!-- 總管專屬：教師帳號管理彈窗 -->
    <div id="teacherManageModal" class="hidden fixed inset-0 z-[60] bg-black/60 flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden flex flex-col max-h-[80vh]">
            <div class="bg-blue-600 p-4 text-white flex justify-between items-center">
                <h2 class="text-lg font-bold"><i class="fa-solid fa-users-gear mr-2"></i>教師帳號管理</h2>
                <button onclick="closeModal('teacherManageModal')" class="text-white/80 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <div class="p-6 flex-1 overflow-y-auto">
                <div class="bg-blue-50 p-4 rounded-xl border border-blue-100 mb-6">
                    <h3 class="font-bold text-blue-800 mb-3 text-sm">新增一位教師</h3>
                    <div class="flex gap-2 mb-2">
                        <input type="text" id="newTName" placeholder="教師姓名/稱呼" class="w-1/2 p-2 text-sm border rounded-lg focus:outline-none focus:border-blue-400">
                        <input type="text" id="newTPwd" placeholder="設定登入密碼" class="w-1/2 p-2 text-sm border rounded-lg focus:outline-none focus:border-blue-400">
                    </div>
                    <button id="addTBtn" onclick="addTeacher()" class="w-full bg-blue-600 text-white font-bold py-2 rounded-lg hover:bg-blue-700 text-sm transition">新增帳號</button>
                </div>
                
                <h3 class="font-bold text-gray-700 mb-3 border-b pb-2">目前已授權的教師名單</h3>
                <div id="teacherListContainer" class="space-y-2">
                    <!-- 教師名單由 JS 動態產生 -->
                    <div class="text-center text-gray-400 text-sm py-4">載入中...</div>
                </div>
            </div>
        </div>
    </div>

    <!-- 主題切換彈窗 -->
    <div id="themeModal" class="hidden fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4 backdrop-blur-sm"><div class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl overflow-hidden"><div class="bg-amber-600 p-4 text-white flex justify-between items-center"><h2 class="text-lg font-bold"><i class="fa-solid fa-palette mr-2"></i>切換主題與背景</h2><button onclick="closeModal('themeModal')" class="text-white/80 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button></div><div class="p-6 grid grid-cols-1 md:grid-cols-3 gap-4"><button onclick="applyTheme('晨讀心得分享牆 📖 ✏️', '閱讀推廣', '歡迎興嘉國小的同學們！讀完一本好書後，請寫下 50 字心得與喜愛的一句話，並拍照上傳與全班分享喔！')" class="p-4 border-2 border-transparent bg-amber-50 rounded-xl hover:border-amber-400 text-left transition"><div class="text-3xl mb-2">📚</div><div class="font-bold text-gray-800">晨讀心得牆</div></button><button onclick="applyTheme('教師節敬師感恩牆 🍎', '敬師活動', '大聲說出你的感謝！請寫下對老師的感恩與祝福。')" class="p-4 border-2 border-transparent bg-orange-50 rounded-xl hover:border-orange-400 text-left transition"><div class="text-3xl mb-2">🍎</div><div class="font-bold text-gray-800">教師節敬師</div></button><button onclick="applyTheme('母親節感恩牆 🌸', '感恩溫馨', '母親節快樂！留下你想對媽媽說的心裡話，給媽媽一個驚喜吧。')" class="p-4 border-2 border-transparent bg-pink-50 rounded-xl hover:border-pink-400 text-left transition"><div class="text-3xl mb-2">🌸</div><div class="font-bold text-gray-800">母親節感恩</div></button></div></div></div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycby4qr-hd5bA_rsg0MU5qvXk1cGXcYS2HK_yh5G_kqNIS7ODQooUc12sA--dqbxDsBI4/exec";
        let notes = JSON.parse(localStorage.getItem('eduWallNotes')) || [];
        let currentColor = 'bg-green-400';
        let currentImageBase64 = ''; 
        
        let isAdminLoggedIn = false; 
        let savedAdminPwd = ''; 

        function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
        function selectColor(color) { currentColor = color; }

        function applyTheme(title, tag, desc) {
            document.getElementById('headerTitle').innerText = title;
            document.getElementById('headerTag').innerText = tag;
            document.getElementById('headerDesc').innerText = desc;
            closeModal('themeModal');
        }

        function updateStats() {
            document.getElementById('updateTime').innerText = `更新時間：${new Date().toLocaleTimeString('zh-TW', {hour: '2-digit', minute:'2-digit'})}`;
            document.getElementById('statPosts').innerText = notes.length;
            document.getElementById('statLikes').innerText = notes.reduce((sum, note) => sum + (note.likes || 0), 0);
        }

        // ==========================================
        // 登入驗證與登出系統
        // ==========================================
        function checkAdmin() {
            const inputPwd = document.getElementById('adminPwd').value.trim();
            if(!inputPwd) { alert('請輸入密碼！'); return; }
            
            const btn = document.getElementById('loginBtn');
            const ogText = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i>雲端驗證中...';
            btn.disabled = true;

            const formData = new URLSearchParams();
            formData.append('action', 'login');
            formData.append('pwd', inputPwd);

            fetch(GAS_URL, { method: 'POST', body: formData })
            .then(res => res.json())
            .then(data => {
                btn.innerHTML = ogText;
                btn.disabled = false;
                if(data.status === 'success') {
                    savedAdminPwd = inputPwd; 
                    isAdminLoggedIn = true; 
                    
                    document.getElementById('adminLogin').classList.add('hidden');
                    document.getElementById('adminPanel').classList.remove('hidden');
                    
                    // 切換頂部按鈕狀態
                    document.getElementById('teacherBtn').classList.add('hidden');
                    document.getElementById('adminControls').classList.remove('hidden');
                    
                    const roleBadge = document.getElementById('roleBadge');
                    if (data.role === 'superadmin') {
                        roleBadge.innerHTML = '<i class="fa-solid fa-crown mr-1"></i>最高總管';
                        roleBadge.className = 'bg-purple-100 text-purple-700 px-2 py-1.5 rounded-lg text-sm font-bold border border-purple-200 hidden sm:block';
                        document.getElementById('superAdminBtn').classList.remove('hidden');
                    } else {
                        roleBadge.innerHTML = '<i class="fa-solid fa-user-check mr-1"></i>教師模式';
                        roleBadge.className = 'bg-green-100 text-green-700 px-2 py-1.5 rounded-lg text-sm font-bold border border-green-200 hidden sm:block';
                        document.getElementById('superAdminBtn').classList.add('hidden');
                    }
                    
                    document.getElementById('adminPwd').value = ''; 
                    renderWall(); 
                } else {
                    alert(data.message);
                }
            })
            .catch(e => {
                btn.innerHTML = ogText;
                btn.disabled = false;
                alert('連線失敗，請檢查網路狀態。');
            });
        }
        
        function logoutAdmin() {
            isAdminLoggedIn = false;
            savedAdminPwd = '';
            
            document.getElementById('adminControls').classList.add('hidden');
            document.getElementById('teacherBtn').classList.remove('hidden');
            
            document.getElementById('adminPanel').classList.add('hidden');
            document.getElementById('adminLogin').classList.remove('hidden');
            document.getElementById('superAdminBtn').classList.add('hidden');
            
            renderWall(); 
            alert('已成功登出管理模式！');
        }

        // ==========================================
        // 總管專屬功能：教師名單管理
        // ==========================================
        function openTeacherManage() {
            openModal('teacherManageModal');
            loadTeacherList();
        }

        function loadTeacherList() {
            const container = document.getElementById('teacherListContainer');
            container.innerHTML = '<div class="text-center text-gray-400 text-sm py-4"><i class="fa-solid fa-spinner fa-spin mr-2"></i>讀取名單中...</div>';
            
            const formData = new URLSearchParams();
            formData.append('action', 'getTeachers');
            formData.append('pwd', savedAdminPwd);

            fetch(GAS_URL, { method: 'POST', body: formData })
            .then(res => res.json())
            .then(data => {
                if(data.status === 'success') {
                    container.innerHTML = '';
                    if (data.teachers.length === 0) {
                        container.innerHTML = '<div class="text-sm text-gray-500 text-center py-2">目前尚未新增任何教師帳號。</div>';
                    }
                    data.teachers.forEach(t => {
                        container.innerHTML += `
                            <div class="flex justify-between items-center bg-gray-50 p-3 rounded-lg border border-gray-200">
                                <div><div class="font-bold text-gray-800 text-sm">${t.name}</div><div class="text-xs text-gray-500 font-mono">密碼: ${t.pwd}</div></div>
                                <button onclick="deleteTeacher('${t.pwd}')" class="text-red-500 hover:text-red-700 hover:bg-red-50 p-2 rounded-lg transition"><i class="fa-solid fa-trash"></i></button>
                            </div>
                        `;
                    });
                } else {
                    container.innerHTML = `<div class="text-red-500 text-sm py-2">${data.message}</div>`;
                }
            });
        }

        function addTeacher() {
            const tName = document.getElementById('newTName').value.trim();
            const tPwd = document.getElementById('newTPwd').value.trim();
            if(!tName || !tPwd) return alert('請輸入教師姓名與密碼！');

            const btn = document.getElementById('addTBtn');
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
            
            const formData = new URLSearchParams();
            formData.append('action', 'addTeacher');
            formData.append('pwd', savedAdminPwd);
            formData.append('teacherName', tName);
            formData.append('teacherPwd', tPwd);

            fetch(GAS_URL, { method: 'POST', body: formData })
            .then(res => res.json())
            .then(data => {
                btn.innerHTML = '新增帳號';
                if(data.status === 'success') {
                    document.getElementById('newTName').value = '';
                    document.getElementById('newTPwd').value = '';
                    loadTeacherList();
                } else alert(data.message);
            });
        }

        function deleteTeacher(delPwd) {
            if(confirm('確定要刪除這位教師的權限嗎？')) {
                const formData = new URLSearchParams();
                formData.append('action', 'deleteTeacher');
                formData.append('pwd', savedAdminPwd);
                formData.append('teacherPwd', delPwd);

                fetch(GAS_URL, { method: 'POST', body: formData })
                .then(res => res.json())
                .then(data => {
                    if(data.status === 'success') loadTeacherList();
                    else alert(data.message);
                });
            }
        }

        // ==========================================
        // 編輯與刪除貼文
        // ==========================================
        function openEditModal(id) {
            const note = notes.find(n => n.id === id);
            if(!note) return;
            document.getElementById('editId').value = note.id;
            document.getElementById('editClass').value = note.classInfo;
            document.getElementById('editName').value = note.name;
            document.getElementById('editTitle').value = note.title;
            document.getElementById('editContent').value = note.content;
            openModal('editModal');
        }

        function submitEdit() {
            const id = document.getElementById('editId').value;
            const note = notes.find(n => n.id === id);
            if(!note) return;
            note.classInfo = document.getElementById('editClass').value;
            note.name = document.getElementById('editName').value;
            note.title = document.getElementById('editTitle').value;
            note.content = document.getElementById('editContent').value;
            
            localStorage.setItem('eduWallNotes', JSON.stringify(notes));
            renderWall();
            closeModal('editModal');

            const formData = new URLSearchParams();
            formData.append('action', 'edit');
            formData.append('pwd', savedAdminPwd);
            formData.append('id', id);
            formData.append('classInfo', note.classInfo);
            formData.append('name', note.name);
            formData.append('title', note.title);
            formData.append('content', note.content);
            fetch(GAS_URL, { method: 'POST', body: formData });
        }

        function deleteSingleNote(id) {
            if(confirm('確定要「刪除」這篇留言嗎？')) {
                notes = notes.filter(n => n.id !== id);
                localStorage.setItem('eduWallNotes', JSON.stringify(notes));
                renderWall();

                const formData = new URLSearchParams();
                formData.append('action', 'deleteSingle');
                formData.append('pwd', savedAdminPwd);
                formData.append('id', id);
                fetch(GAS_URL, { method: 'POST', body: formData });
            }
        }

        function clearAllNotes() {
            if(confirm('警告！確定要清空雲端與牆面上「所有」的留言嗎？無法復原喔！')) {
                const formData = new URLSearchParams();
                formData.append('action', 'clear');
                formData.append('pwd', savedAdminPwd);

                fetch(GAS_URL, { method: 'POST', body: formData })
                .then(res => res.json())
                .then(data => {
                    if(data.status === 'success') {
                        notes = [];
                        localStorage.setItem('eduWallNotes', JSON.stringify(notes));
                        renderWall(); closeModal('teacherModal');
                        alert('留言牆已成功清空！');
                    } else alert(data.message);
                });
            }
        }

        // ==========================================
        // 圖片上傳與渲染
        // ==========================================
        function previewImage(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    let width = img.width, height = img.height;
                    if (width > 600) { height = Math.round((height * 600) / width); width = 600; }
                    canvas.width = width; canvas.height = height;
                    canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                    currentImageBase64 = canvas.toDataURL('image/jpeg', 0.7); 
                    document.getElementById('imagePreview').src = currentImageBase64;
                    document.getElementById('imagePreviewContainer').classList.remove('hidden');
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function clearImage() {
            currentImageBase64 = '';
            document.getElementById('postImage').value = '';
            document.getElementById('imagePreviewContainer').classList.add('hidden');
        }

        function renderWall() {
            const container = document.getElementById('wallContainer');
            container.innerHTML = '';
            if (notes.length === 0) {
                container.innerHTML = `<div class="w-full text-center py-20 text-gray-500 font-medium col-span-full"><i class="fa-solid fa-box-open text-4xl mb-3 block text-gray-300"></i>目前還沒有便利貼，趕快搶頭香！</div>`;
                updateStats(); return;
            }

            const displayNotes = [...notes].reverse(); 
            displayNotes.forEach(note => {
                const card = document.createElement('div');
                card.className = `masonry-item note-card bg-white p-4 rounded-xl shadow-sm border border-gray-200 group`;
                
                let adminButtons = '';
                if (isAdminLoggedIn) {
                    adminButtons = `
                        <div class="absolute top-2 right-2 flex gap-1 z-10 opacity-0 group-hover:opacity-100 transition-opacity">
                            <button onclick="openEditModal('${note.id}')" class="bg-gray-800 text-white w-8 h-8 rounded-full shadow hover:bg-gray-700 flex items-center justify-center" title="編輯"><i class="fa-solid fa-pen text-xs"></i></button>
                            <button onclick="deleteSingleNote('${note.id}')" class="bg-red-500 text-white w-8 h-8 rounded-full shadow hover:bg-red-600 flex items-center justify-center" title="刪除"><i class="fa-solid fa-trash text-xs"></i></button>
                        </div>
                    `;
                }

                const imgHTML = note.image ? `<img src="${note.image}" class="w-full rounded-lg mb-3 object-cover max-h-64 border border-gray-100" loading="lazy">` : '';

                card.innerHTML = `
                    ${adminButtons}
                    <div class="flex items-center gap-3 mb-3 pr-10">
                        <div class="w-9 h-9 rounded-full ${note.color} flex items-center justify-center text-white text-sm shadow-sm flex-shrink-0"><i class="fa-solid fa-user-graduate"></i></div>
                        <div class="truncate">
                            <div class="font-bold text-sm text-gray-900 truncate">${note.classInfo} ${note.name}</div>
                            <div class="text-xs text-gray-500">${note.date}</div>
                        </div>
                    </div>
                    ${imgHTML}
                    <h3 class="font-bold text-gray-800 text-[16px] mb-1 leading-snug break-words">${note.title}</h3>
                    <p class="text-gray-700 text-[14px] whitespace-pre-wrap leading-relaxed mb-4 break-words">${note.content}</p>
                    <div class="flex items-center gap-4 text-gray-500 text-sm mt-3 pt-3 border-t border-gray-100">
                        <button onclick="likeNote('${note.id}', event)" class="flex items-center gap-1.5 hover:text-orange-500 transition font-medium">
                            <i class="fa-solid fa-thumbs-up ${note.likes > 0 ? 'text-orange-400' : ''}"></i> <span id="like-${note.id}">${note.likes || 0}</span>
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });
            updateStats();
        }

        // ==========================================
        // 投稿與同步
        // ==========================================
        function submitPost() {
            const classInfo = document.getElementById('postClass').value.trim();
            const name = document.getElementById('postName').value.trim();
            const title = document.getElementById('postTitle').value.trim();
            const content = document.getElementById('postContent').value.trim();

            if (!classInfo || !name || !title) return alert('提醒您：「班級」、「姓名」與「標題」為必填欄位喔！');
            if (!content && !currentImageBase64) return alert('提醒您：請填寫「想法內容」或是「上傳照片」唷！（至少二擇一）');

            const newNote = {
                id: 'id_' + Date.now().toString(),
                classInfo: classInfo, name: name, title: title, content: content,
                color: currentColor, date: '剛剛', likes: 0, image: currentImageBase64 
            };

            notes.push(newNote);
            localStorage.setItem('eduWallNotes', JSON.stringify(notes));
            renderWall();
            
            document.getElementById('postClass').value = ''; document.getElementById('postName').value = '';
            document.getElementById('postTitle').value = ''; document.getElementById('postContent').value = '';
            clearImage(); closeModal('postModal');

            syncToGAS('add', newNote);
        }

        function likeNote(id, event) {
            const note = notes.find(n => n.id === id);
            if(note) {
                note.likes = (note.likes || 0) + 1;
                document.getElementById(`like-${id}`).innerText = note.likes;
                localStorage.setItem('eduWallNotes', JSON.stringify(notes));
                if(event) {
                    const btn = event.currentTarget.querySelector('.fa-thumbs-up');
                    if(btn) btn.classList.add('text-orange-400');
                }
                syncToGAS('like', { id: id, likes: note.likes });
                updateStats();
            }
        }

        function syncToGAS(action, data) {
            const formData = new URLSearchParams();
            formData.append('action', action);
            if(action === 'add' || action === 'like') formData.append('id', data.id);
            if(action === 'add') {
                formData.append('date', new Date().toLocaleDateString('zh-TW')); 
                formData.append('classInfo', data.classInfo);
                formData.append('name', data.name);
                formData.append('title', data.title);
                formData.append('content', data.content);
                formData.append('color', data.color);
                if (data.image) formData.append('image', data.image); 
            }
            if(action === 'like') formData.append('likes', data.likes);
            fetch(GAS_URL, { method: 'POST', body: formData });
        }

        function syncWithCloud() {
            const btn = document.getElementById('syncBtn');
            const originalHTML = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-1"></i>同步中';
            fetch(GAS_URL).then(res => res.json()).then(data => {
                if (data && data.length > 0) { notes = data; localStorage.setItem('eduWallNotes', JSON.stringify(notes)); renderWall(); }
                btn.innerHTML = '<i class="fa-solid fa-check text-green-600 mr-1"></i>已同步';
                setTimeout(() => btn.innerHTML = originalHTML, 2000);
            }).catch(err => {
                btn.innerHTML = '<i class="fa-solid fa-check text-green-600 mr-1"></i>完成'; 
                setTimeout(() => btn.innerHTML = originalHTML, 2000);
            });
        }

        document.addEventListener('DOMContentLoaded', () => { renderWall(); syncWithCloud(); });
    </script>
</body>
</html>
